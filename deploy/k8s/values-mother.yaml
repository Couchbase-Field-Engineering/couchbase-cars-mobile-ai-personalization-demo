# cbcars-app on "mother" (single-node K3s, managed by Rancher) at 192.168.111.4.
# Secrets (the AOM admin password) are NOT kept here - deploy.sh writes them to
# a mode-600 values file on mother instead.
publicHost: "192.168.111.4"
# mother has no working LoadBalancer (ServiceLB), so publish on the node IP directly.
externalIPs: ["192.168.111.4"]

aom:
  enabled: true
  # The AOM this demo registers with: the AOM behind the public IP, whose
  # dashboard (port 4111) proxies the API. It is outside the cluster, so it
  # reaches this demo's MCP server through the backend port published on the
  # node (8202), and the backend bootstrap registers both agent identities there.
  # (The in-cluster agent-ops release, dashboard https://192.168.111.4:3111, is the
  # alternative: url https://aom-operations-manager.agent-ops.svc.cluster.local:8090
  # and mcpPublicUrl blank.)
  url: https://45.52.200.223:4111
  mcpPublicUrl: http://192.168.111.4:8202/cbcars/mcp
  # Linked from the story page.
  dashboardUrl: https://45.52.200.223:4111
  verifyTls: false

# K3s's ServiceLB (Klipper) binds each LoadBalancer port on the node's IP.
# The Royal Caribbean demo (release royal-app) holds 8081 / 8200 / 4984 on
# mother and the Princess demo (princess-app) holds 8082 / 8201 / 4986, so
# this demo publishes the next free port of each:
#   5158 the app (HTTPS, behind the sign-in page), 8202 the backend API, 4987 Sync Gateway (Couchbase Lite).
# AOM's dashboard is on 3111 (agent-ops chart, values-k3s.yaml).
web:
  service: { type: LoadBalancer, port: 5158 }
backend:
  service: { type: LoadBalancer, port: 8202 }
syncGateway:
  service: { type: LoadBalancer, port: 4987 }
